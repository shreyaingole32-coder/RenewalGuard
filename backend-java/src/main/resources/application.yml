server:
  port: ${PORT:8080}

spring:
  application:
    name: renewalguard-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/renewalguard}
    username: ${DATABASE_USERNAME:renewalguard}
    password: ${DATABASE_PASSWORD:renewalguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

renewalguard:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-vars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  agent-service:
    base-url: ${AGENT_SERVICE_URL:http://localhost:9000}   # Python Strands agent service
    api-key: ${AGENT_SERVICE_API_KEY:local-dev-key}

logging:
  level:
    com.renewalguard: INFO
    org.springframework.security: WARN
